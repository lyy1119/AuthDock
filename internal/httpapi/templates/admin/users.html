<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthDock · 用户管理</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="主导航">
    <button class="rail-toggle" id="rail-toggle" type="button" title="展开或折叠导航" aria-label="展开或折叠导航">
      <span data-icon="menu"></span>
      <span class="label">折叠</span>
    </button>
    <a class="rail-link" href="users" aria-current="page" title="用户管理">
      <span data-icon="users"></span>
      <span class="label">用户管理</span>
    </a>
    <a class="rail-link" href="gateway" title="网关设置">
      <span data-icon="server"></span>
      <span class="label">网关设置</span>
    </a>
    <a class="rail-link" href="settings" title="系统设置">
      <span data-icon="gear"></span>
      <span class="label">系统设置</span>
    </a>
  </nav>

  <main class="content">
    <header class="page-head">
      <h1>用户管理</h1>
      <button class="logout" id="logout" type="button" title="退出登录">
        <span data-icon="logout"></span>
        <span>退出登录</span>
      </button>
    </header>

    <div class="toolbar">
      <span class="grow"></span>
      <button class="btn btn-primary" id="add-user" type="button">新增用户</button>
    </div>

    <p class="empty" id="empty" hidden>还没有用户</p>

    <table class="table" id="users-table" hidden>
      <thead>
        <tr>
          <th>用户名</th>
          <th>密码</th>
          <th>身份</th>
          <th class="align-right">操作</th>
        </tr>
      </thead>
      <tbody id="users-body"></tbody>
    </table>

    <p class="msg" id="message" role="status"></p>
  </main>
</div>

<dialog class="dialog" id="user-dialog" aria-labelledby="user-dialog-title">
  <form id="user-form">
    <h2 id="user-dialog-title">新增用户</h2>
    <label>用户名
      <input class="field" id="new-username" maxlength="20" autocomplete="off" required>
    </label>
    <label>密码
      <input class="field" id="new-password" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    <label>身份
      <select class="field" id="new-role">
        <option value="user">普通用户</option>
        <option value="admin">管理员</option>
      </select>
    </label>
    <p class="msg" id="dialog-message" role="alert"></p>
    <div class="dialog-actions">
      <button class="btn" id="cancel-new" type="button">取消</button>
      <button class="btn btn-primary" id="create-user" type="submit">创建</button>
    </div>
  </form>
</dialog>

<script src="assets/admin.js" defer></script>
<script src="assets/users.js" defer></script>
</body>
</html>
