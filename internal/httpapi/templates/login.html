<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthDock · 管理员登录</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #1f2328;
  }
  main {
    width: min(100%, 22rem);
    padding: 1.75rem;
    background: #fff;
    border: 1px solid #e4e7eb;
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(16, 24, 40, .07);
  }
  h1 { margin: 0 0 .3rem; font-size: 1.3rem; letter-spacing: .01em; }
  .sub { margin: 0 0 1.5rem; color: #6b7280; font-size: .85rem; }
  label { display: block; margin: 0 0 .35rem; font-size: .82rem; font-weight: 600; }
  input {
    width: 100%;
    margin-bottom: 1rem;
    padding: .62rem .7rem;
    font-size: 1rem;
    color: inherit;
    background: #fff;
    border: 1px solid #cfd4da;
    border-radius: 8px;
  }
  input:focus { outline: 2px solid rgba(37, 99, 235, .25); border-color: #2563eb; }
  button {
    width: 100%;
    padding: .68rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 1.3rem; margin: .8rem 0 0; font-size: .85rem; color: #b91c1c; }
</style>
</head>
<body>
<main>
  <h1>AuthDock</h1>
  <p class="sub">管理后台登录（仅限 admin 角色）</p>
  <form id="login-form" novalidate>
    <label for="username">用户名</label>
    <input id="username" name="username" maxlength="20" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登录</button>
    <p class="msg" id="message" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById('login-form');
  var message = document.getElementById('message');
  var submit = document.getElementById('submit');

  // Everything is relative to the page URL so the app also works when a reverse
  // proxy mounts it under a path prefix (code-server: /proxy/<port>/).
  var baseUrl = new URL('./', window.location.href);
  var loginEndpoint = new URL('api/auth/login', baseUrl);

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    message.textContent = '';

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) {
      message.textContent = '请输入用户名和密码';
      return;
    }

    submit.disabled = true;
    try {
      var response = await fetch(loginEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await response.json().catch(function () { return {}; });

      if (response.ok && data.ok) {
        alert('登录成功');
        window.location.href = new URL('admin/users', baseUrl).href;
        return;
      }
      message.textContent = data.message || ('登录失败（HTTP ' + response.status + '）');
    } catch (err) {
      message.textContent = '无法连接服务器，请稍后重试';
    } finally {
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
