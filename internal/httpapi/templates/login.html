<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthDock · 管理员登录</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e4e7eb;
    --text: #1f2328;
    --muted: #6b7280;
    --input-bg: #ffffff;
    --input-border: #cfd4da;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-ring: rgba(37, 99, 235, .25);
    --danger: #b91c1c;
    --shadow: 0 10px 28px rgba(16, 24, 40, .07);
  }

  /* Dark palette: used when the theme is dark, or when "auto" meets a dark OS. */
  :root[data-theme='dark'] {
    --bg: #13181d;
    --card: #1b2229;
    --border: #2b353e;
    --text: #e7edf3;
    --muted: #94a3b1;
    --input-bg: #141a20;
    --input-border: #3a4652;
    --accent: #4c8dff;
    --accent-hover: #6ba0ff;
    --accent-ring: rgba(76, 141, 255, .3);
    --danger: #ff8377;
    --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  }

  @media (prefers-color-scheme: dark) {
    :root[data-theme='auto'] {
      --bg: #13181d;
      --card: #1b2229;
      --border: #2b353e;
      --text: #e7edf3;
      --muted: #94a3b1;
      --input-bg: #141a20;
      --input-border: #3a4652;
      --accent: #4c8dff;
      --accent-hover: #6ba0ff;
      --accent-ring: rgba(76, 141, 255, .3);
      --danger: #ff8377;
      --shadow: 0 10px 28px rgba(0, 0, 0, .45);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    width: min(100%, 22rem);
    padding: 1.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  h1 { margin: 0 0 .3rem; font-size: 1.3rem; letter-spacing: .01em; }
  .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .85rem; }
  label { display: block; margin: 0 0 .35rem; font-size: .82rem; font-weight: 600; }
  input {
    width: 100%;
    margin-bottom: 1rem;
    padding: .62rem .7rem;
    font-size: 1rem;
    color: inherit;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent-ring); border-color: var(--accent); }
  button {
    width: 100%;
    padding: .68rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 1.3rem; margin: .8rem 0 0; font-size: .85rem; color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>AuthDock</h1>
  <p class="sub">管理后台登录（仅限 admin 角色）</p>
  <form id="login-form" novalidate>
    <label for="username">用户名</label>
    <input id="username" name="username" maxlength="20" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登录</button>
    <p class="msg" id="message" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById('login-form');
  var message = document.getElementById('message');
  var submit = document.getElementById('submit');

  // Everything is relative to the page URL so the app also works when a reverse
  // proxy mounts it under a path prefix (code-server: /proxy/<port>/).
  var baseUrl = new URL('./', window.location.href);
  var loginEndpoint = new URL('api/auth/login', baseUrl);

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    message.textContent = '';

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) {
      message.textContent = '请输入用户名和密码';
      return;
    }

    submit.disabled = true;
    try {
      var response = await fetch(loginEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await response.json().catch(function () { return {}; });

      if (response.ok && data.ok) {
        alert('登录成功');
        window.location.href = new URL('admin/', baseUrl).href;
        return;
      }
      message.textContent = data.message || ('登录失败（HTTP ' + response.status + '）');
    } catch (err) {
      message.textContent = '无法连接服务器，请稍后重试';
    } finally {
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
