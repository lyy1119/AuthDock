<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthDock · 管理后台</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #1f2328;
  }
  main {
    width: min(100%, 32rem);
    padding: 1.75rem;
    background: #fff;
    border: 1px solid #e4e7eb;
    border-radius: 12px;
  }
  h1 { margin: 0 0 .75rem; font-size: 1.2rem; }
  p { margin: 0 0 1rem; line-height: 1.6; color: #374151; }
  code { padding: .1rem .35rem; background: #f2f3f5; border-radius: 4px; font-size: .9em; }
  button {
    padding: .5rem .9rem;
    font-size: .9rem;
    font-weight: 600;
    color: #1f2328;
    background: #f3f4f6;
    border: 1px solid #d7dbe0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #e9eaee; }
</style>
</head>
<body>
<main>
  <h1>AuthDock 管理后台</h1>
  <p>已以管理员 <strong>{{.Username}}</strong> 身份登录（角色：<code>admin</code>）。</p>
  <p>后台页面尚未设计，这里只是占位页，用来验证会话可用。</p>
  <button id="logout" type="button">退出登录</button>
</main>
<script>
  document.getElementById('logout').addEventListener('click', async function () {
    try {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
    } finally {
      window.location.href = '/login';
    }
  });
</script>
</body>
</html>
