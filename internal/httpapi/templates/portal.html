<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthDock · 登录</title>
<style>
  :root {
    --bg: #eef3f7;
    --card: #ffffff;
    --border: #e0e8ee;
    --text: #16232b;
    --muted: #6b7c88;
    --input-bg: #ffffff;
    --input-border: #cfdae2;
    --accent: #2f6fa8;
    --accent-hover: #245a8a;
    --accent-ring: rgba(47, 111, 168, .25);
    --danger: #b3382c;
    --ok: #1f7a4d;
    --panel: #f4f8fb;
    --panel-border: #dbe7f0;
    --badge-bg: #e4eff8;
    --badge-text: #245a8a;
    --quiet-bg: #f1f5f9;
    --quiet-border: #dbe4ec;
    --quiet-text: #47586a;
    --shadow: 0 12px 32px rgba(16, 35, 47, .08);
  }

  :root[data-theme='dark'] {
    --bg: #121820;
    --card: #1a2129;
    --border: #2a343d;
    --text: #e7edf3;
    --muted: #93a3b0;
    --input-bg: #131a21;
    --input-border: #39454f;
    --accent: #5b9bd5;
    --accent-hover: #7cb2e2;
    --accent-ring: rgba(91, 155, 213, .3);
    --danger: #ff8278;
    --ok: #52c98a;
    --panel: #172029;
    --panel-border: #27333d;
    --badge-bg: #1d2b38;
    --badge-text: #8fc3e8;
    --quiet-bg: #1d262e;
    --quiet-border: #2f3a44;
    --quiet-text: #c3ced8;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  }

  @media (prefers-color-scheme: dark) {
    :root[data-theme='auto'] {
      --bg: #121820;
      --card: #1a2129;
      --border: #2a343d;
      --text: #e7edf3;
      --muted: #93a3b0;
      --input-bg: #131a21;
      --input-border: #39454f;
      --accent: #5b9bd5;
      --accent-hover: #7cb2e2;
      --accent-ring: rgba(91, 155, 213, .3);
      --danger: #ff8278;
      --ok: #52c98a;
      --panel: #172029;
      --panel-border: #27333d;
      --badge-bg: #1d2b38;
      --badge-text: #8fc3e8;
      --quiet-bg: #1d262e;
      --quiet-border: #2f3a44;
      --quiet-text: #c3ced8;
      --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  main {
    width: min(100%, 24rem);
    padding: 1.9rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .brand { margin: 0 0 .3rem; font-size: 1.35rem; font-weight: 700; letter-spacing: .01em; color: var(--accent); }
  .sub { margin: 0 0 1.6rem; font-size: .85rem; color: var(--muted); }
  label { display: block; margin: 0 0 .35rem; font-size: .82rem; font-weight: 600; }
  input {
    width: 100%;
    margin-bottom: 1rem;
    padding: .65rem .72rem;
    font: inherit;
    color: inherit;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 9px;
  }
  input:focus { outline: 2px solid var(--accent-ring); border-color: var(--accent); }
  button {
    width: 100%;
    padding: .7rem;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: progress; }
  button.quiet { color: var(--quiet-text); background: var(--quiet-bg); border: 1px solid var(--quiet-border); }
  button.quiet:hover:not(:disabled) { background: var(--quiet-border); }
  .msg { min-height: 1.3rem; margin: .8rem 0 0; font-size: .85rem; color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .who { margin: 0 0 1.2rem; padding: .9rem 1rem; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; font-size: .95rem; }
  .who strong { color: var(--text); }
  .role { margin-left: .4rem; padding: .1rem .45rem; font-size: .75rem; color: var(--badge-text); background: var(--badge-bg); border-radius: 999px; }
  .hint { margin: .2rem 0 .3rem; font-size: .9rem; color: var(--muted); }
  #address-list { margin: 0 0 1rem; padding-left: 1.2rem; line-height: 1.9; }
  #address-list a { color: var(--accent); word-break: break-all; }
  .hidden { display: none; }
  .foot { margin: 1.2rem 0 0; font-size: .78rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 class="brand">AuthDock</h1>
  <p class="sub">使用你的账号登录</p>

  <form id="login-form">
    <label for="username">用户名</label>
    <input id="username" name="username" maxlength="20" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">登录</button>
    <p class="msg" id="message" role="alert"></p>
  </form>

  <section id="session" class="hidden">
    <p class="who">已登录：<strong id="session-name"></strong><span class="role" id="session-role"></span></p>
    <div id="session-addresses" class="hidden">
      <p class="hint">你可以访问：</p>
      <ul id="address-list"></ul>
    </div>
    <button id="logout" class="quiet" type="button">退出登录</button>
    <p class="msg" id="session-message"></p>
  </section>

  <p class="foot" id="domain-foot"></p>
</main>
<script>
(function () {
  'use strict';

  // Relative URLs keep the portal working when it sits behind a reverse proxy.
  var base = new URL('./', window.location.href);
  var loginEndpoint = new URL('api/login', base);
  var sessionEndpoint = new URL('api/session', base);
  var logoutEndpoint = new URL('api/logout', base);

  // Where to go after signing in (set by the gateway when it bounced a request).
  var returnTo = new URLSearchParams(window.location.search).get('return_to') || '';

  var form = document.getElementById('login-form');
  var message = document.getElementById('message');
  var submit = document.getElementById('submit');
  var sessionPanel = document.getElementById('session');
  var sessionName = document.getElementById('session-name');
  var sessionRole = document.getElementById('session-role');
  var sessionMessage = document.getElementById('session-message');

  function roleLabel(role) {
    return role === 'admin' ? '管理员' : '普通用户';
  }

  var addressBox = document.getElementById('session-addresses');
  var addressList = document.getElementById('address-list');

  function showAddresses(addresses) {
    addressList.replaceChildren();
    if (!addresses || addresses.length === 0) {
      addressBox.classList.add('hidden');
      return;
    }
    addresses.forEach(function (address) {
      var item = document.createElement('li');
      var link = document.createElement('a');
      link.href = address;
      link.textContent = address;
      item.appendChild(link);
      addressList.appendChild(item);
    });
    addressBox.classList.remove('hidden');
  }

  function showSession(user, addresses) {
    sessionName.textContent = user.username;
    sessionRole.textContent = roleLabel(user.role);
    form.classList.add('hidden');
    sessionPanel.classList.remove('hidden');
    showAddresses(addresses);
  }

  function showLogin() {
    sessionPanel.classList.add('hidden');
    form.classList.remove('hidden');
  }

  async function readSession() {
    try {
      var response = await fetch(sessionEndpoint, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
      if (!response.ok) return;
      var data = await response.json();
      if (data && data.ok && data.user) showSession(data.user, data.addresses);
    } catch (err) {
      /* Not signed in yet: the form is already visible. */
    }
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    message.textContent = '';
    submit.disabled = true;
    try {
      var response = await fetch(loginEndpoint, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          return_to: returnTo
        })
      });
      var data = await response.json().catch(function () { return {}; });
      if (response.ok && data.ok && data.user) {
        document.getElementById('password').value = '';
        if (data.redirect_to) {
          window.location.href = data.redirect_to;
          return;
        }
        showSession(data.user, data.addresses);
        if (data.return_to_rejected) {
          sessionMessage.textContent = '登录成功，但原来的地址不属于网关域名，因此没有自动跳转。';
        }
        return;
      }
      message.textContent = data.message || ('登录失败（HTTP ' + response.status + '）');
    } catch (err) {
      message.textContent = '无法连接服务器，请稍后重试';
    } finally {
      submit.disabled = false;
    }
  });

  document.getElementById('logout').addEventListener('click', async function () {
    try {
      await fetch(logoutEndpoint, { method: 'POST', credentials: 'same-origin' });
    } catch (err) {
      /* Either way the local view returns to the form. */
    }
    sessionMessage.textContent = '';
    message.textContent = '';
    showLogin();
  });

  document.getElementById('domain-foot').textContent = '此门户只接受通过网关域名访问：' + window.location.host;
  if (returnTo) {
    document.getElementById('login-form');
  }
  readSession();
})();
</script>
</body>
</html>
